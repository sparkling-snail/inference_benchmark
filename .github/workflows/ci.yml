name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the recipe pipeline needs no torch/GPU; the fake server stands in for vLLM
      - run: pip install pyyaml httpx fastapi uvicorn pytest
      - run: python -m pytest tests -q
      - name: smoke matrix (launch -> goodput search -> recipe -> report)
        run: python -m benchmarks run configs/smoke.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-recipes
          path: results/smoke/
