# CPU-only smoke test of the whole pipeline against tests/fake_vllm_server.py.
# The fake server's numbers are meaningless; this only proves launch ->
# goodput search -> recipe -> report works end to end.
#
#   python -m benchmarks run configs/smoke.yaml
name: smoke
results_dir: results/smoke
recipes_dir: results/smoke/recipes
port: 8790

hardware: {gpu: fake, gpus: 1, usd_per_gpu_hour: 1.0}
slo: {ttft_p99_ms: 500, itl_p99_ms: 100}
workload: {prompt_words: [50, 400], output_tokens: [16, 64], duration_s: 6}
search: {start_rate: 4, max_rate: 256, rel_tol: 0.25, max_probes: 6}

deployments:
  - {model: fake-model, engine: fake, name: fake__fast, extra_args: [--step-ms, "8"]}
  - {model: fake-model, engine: fake, name: fake__slow, extra_args: [--step-ms, "25"]}
